name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.x"

      - name: Install dependencies
        run: npm ci

      - name: Check src/oxlintrc.json matches @destination/eslint-config
        run: |
          npm run generate
          if ! git diff --exit-code src/oxlintrc.json; then
            echo "src/oxlintrc.json is out of date. Run 'npm run generate' and commit the result."
            exit 1
          fi

      - name: Lint and format check
        run: npm run check

      - name: Check the fixtures format with the shared config
        run: npm test

  # Aggregate gate with a stable name for branch protection to require,
  # so jobs can be added or renamed without updating the required-check config.
  ci-success:
    name: CI Success
    if: always()
    needs: ci
    runs-on: ubuntu-24.04
    steps:
      - name: Fail if any job failed
        if: needs.ci.result != 'success'
        run: |
          echo "ci result: ${{ needs.ci.result }}"
          exit 1
